spring.application.name=gateway
server.port=8888
# Gateway Routes Configuration

# User Service
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=http://localhost:8000
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**,/api/public/**,/api/auth/**, /api/pets

# Board Service
spring.cloud.gateway.routes[1].id=board-service
spring.cloud.gateway.routes[1].uri=http://localhost:8001
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/boards/**,/api/places/**,/api/comments/**,/api/likes/**

# Reservation Service
spring.cloud.gateway.routes[2].id=reservation-service
spring.cloud.gateway.routes[2].uri=http://localhost:8002
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/reservations/**

# Reservation Service
spring.cloud.gateway.routes[8].id=board-view-service
spring.cloud.gateway.routes[8].uri=http://localhost:8003
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/board-view/**

# Swagger UI - User Service (?? Swagger UI)
spring.cloud.gateway.routes[3].id=swagger-ui
spring.cloud.gateway.routes[3].uri=http://localhost:8000
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/swagger-ui/**
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/api/swagger-ui/(?<path>.*), /api/swagger-ui/$1

# Swagger API Docs - User Service
spring.cloud.gateway.routes[4].id=swagger-api-docs-user
spring.cloud.gateway.routes[4].uri=http://localhost:8000
spring.cloud.gateway.routes[4].predicates[0]=Path=/v3/api-docs/user
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/v3/api-docs/user, /api/v3/api-docs

# Swagger API Docs - Board Service
spring.cloud.gateway.routes[5].id=swagger-api-docs-board
spring.cloud.gateway.routes[5].uri=http://localhost:8001
spring.cloud.gateway.routes[5].predicates[0]=Path=/v3/api-docs/board
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/v3/api-docs/board, /api/v3/api-docs

# Swagger API Docs - Reservation Service
spring.cloud.gateway.routes[6].id=swagger-api-docs-reservation
spring.cloud.gateway.routes[6].uri=http://localhost:8002
spring.cloud.gateway.routes[6].predicates[0]=Path=/v3/api-docs/reservation
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/v3/api-docs/reservation, /api/v3/api-docs

# Swagger API Docs - Board View Service
spring.cloud.gateway.routes[7].id=swagger-api-docs-board-view
spring.cloud.gateway.routes[7].uri=http://localhost:8003
spring.cloud.gateway.routes[7].predicates[0]=Path=/v3/api-docs/board-view
spring.cloud.gateway.routes[7].filters[0]=RewritePath=/v3/api-docs/board-view, /api/v3/api-docs

# JWT Configuration
jwt.secret=your-secret-key-here-change-this-in-production-min-256-bits
#1?
# #jwt.expiration=86400000
# 7?
jwt.expiration=604800000

# Public paths (no JWT required)
jwt.public.paths=/api/public/**,/api/auth/**,/api/swagger-ui/**,/v3/api-docs/**

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
