networks:
  msa-net:
    name: msa-net
    driver: bridge

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    networks:
      - msa-net

  # Kafka (KRaft 모드 - Zookeeper 불필요)
  kafka:
    image: apache/kafka:3.8.1
    container_name: jellypaw-kafka
    environment:
      TZ: Asia/Seoul
    ports:
      - "9092:9092"
    #networks:
    # - jellypaw-network

volumes:
  mysql_data:
