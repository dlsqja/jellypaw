version: "3.8"

services:
  mysql-user:
    image: mysql:8.0
    container_name: jellypaw-user
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: user_db
      TZ: Asia/Seoul
    ports:
      - "3380:3306"
    volumes:
      - mysql-user-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4 #한글, 이모지 등 모든 문자를 저장할 수 있는 UTF-8 인코딩 설정
      - --collation-server=utf8mb4_unicode_ci #문자열 비교 및 정렬 규칙 (대소문자 구분 안 함)
    #networks:
    # - jellypaw-network #여러 Docker 컨테이너가 서로 통신할 수 있도록 하는 가상 네트워크

  # Kafka (KRaft 모드 - Zookeeper 불필요)
  kafka:
    image: apache/kafka:3.8.1
    container_name: jellypaw-kafka
    environment:
      TZ: Asia/Seoul
    ports:
      - "9092:9092"
    #networks:
    # - jellypaw-network

volumes:
  mysql-user-data:
#networks:
#  jellypaw-network:
#    driver: bridge
