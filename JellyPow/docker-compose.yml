services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD}
    ports:
      #- "127.0.0.1:3306:3306"
      - "3306:3306"
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql

  # Kafka (KRaft 모드 - Zookeeper 불필요)
  kafka:
    image: apache/kafka:3.8.1
    container_name: kafka
    environment:
      TZ: Asia/Seoul

      #이 노드가 broker + controller 둘 다 한다
      KAFKA_CLUSTER_ID: "abcdefghijklmnopqrstuv"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_NODE_ID: 1
      #컨트롤러 합의는 이 컨테이너의 29093 포트로
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"

      #실제로 바인딩할 포트들 (컨테이너 내부)
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:29093"

      #리스너 이름 → 프로토콜 매핑
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"

      #컨트롤러들끼리 통신할 때 CONTROLLER 리스너 쓴다
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      #내부 MSA 컨테이너들이 부를 이름만 광고
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

#    networks:
#      - msa-net
    ports:
      - "9092:9092"

  mongo:
    image: mongo:8
    container_name: reservation-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:27017:27017" # 필요하면 127.0.0.1:27017:27017 로 바꿔도 됨
    volumes:
      - ./mongo-data:/data/db

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: jellypaw-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - TZ=Asia/Seoul
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
#    networks:
#      - msa-net
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: jellypaw-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # networks:
    #   - msa-net
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mysql_data:
  elasticsearch_data:
  redis_data:
